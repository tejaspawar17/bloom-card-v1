<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloom - Custom Mood Greeting & Pokémon Cards</title>
    <!-- Google Fonts: Instrument Serif, Instrument Sans, Inter, Source Serif 4, Syne Tactile, Vampiro One -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&family=Syne+Tactile&family=Vampiro+One&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#070908] text-white selection:bg-blue-500 selection:text-white">
    <div id="root">
      <!-- 0ms Zero-Latency Inline Fallback Splash: Exact AnimatedAILoaderFX (Only shown on fresh session) -->
      <div id="app-preloader" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:#070908;z-index:99999;user-select:none;">
        <script>
          try {
            if (sessionStorage.getItem('bloom_has_loaded') === 'true') {
              document.getElementById('app-preloader').style.display = 'none';
            }
          } catch(e) {}
        </script>
        <div style="position:relative;display:flex;align-items:center;justify-content:center;width:180px;height:180px;border-radius:50%;font-family:'Inter',sans-serif;font-size:19px;font-weight:300;color:#ffffff;">
          <style>
            @keyframes bloom-preload-rot {
              0% { transform: rotate(90deg); box-shadow: 0 10px 20px 0 #ffffff inset, 0 20px 30px 0 #ad5fff inset, 0 60px 60px 0 #471eec inset; }
              50% { transform: rotate(270deg); box-shadow: 0 10px 20px 0 #ffffff inset, 0 20px 10px 0 #d60a47 inset, 0 40px 60px 0 #311e80 inset; }
              100% { transform: rotate(450deg); box-shadow: 0 10px 20px 0 #ffffff inset, 0 20px 30px 0 #ad5fff inset, 0 60px 60px 0 #471eec inset; }
            }
            @keyframes bloom-preload-let {
              0%, 100% { opacity: 0.4; transform: translateY(0); }
              20% { opacity: 1; transform: scale(1.15); }
              40% { opacity: 0.7; transform: translateY(0); }
            }
            .f-let { display: inline-block; opacity: 0.4; animation: bloom-preload-let 2s infinite; }
          </style>
          <div style="position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;animation:bloom-preload-rot 2s linear infinite;pointer-events:none;"></div>
          <span style="position:relative;z-index:1;">
            <span class="f-let" style="animation-delay:0s;">G</span>
            <span class="f-let" style="animation-delay:0.1s;">e</span>
            <span class="f-let" style="animation-delay:0.2s;">n</span>
            <span class="f-let" style="animation-delay:0.3s;">e</span>
            <span class="f-let" style="animation-delay:0.4s;">r</span>
            <span class="f-let" style="animation-delay:0.5s;">a</span>
            <span class="f-let" style="animation-delay:0.6s;">t</span>
            <span class="f-let" style="animation-delay:0.7s;">i</span>
            <span class="f-let" style="animation-delay:0.8s;">n</span>
            <span class="f-let" style="animation-delay:0.9s;">g</span>
          </span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
